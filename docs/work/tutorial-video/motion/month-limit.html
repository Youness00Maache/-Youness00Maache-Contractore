<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>motion: free plan job limit</title>
<style>
  :root { --bg:#0b1220; --panel:#121a2b; --line:#22304a; --text:#e6ebf5; --mute:#8fa0bd; --accent:#4f7cff; --ok:#34d399; --warn:#fbbf24; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family: Inter, system-ui, 'Segoe UI', sans-serif; overflow:hidden; }
  .stage { position:relative; width:100vw; height:100vh; display:grid; place-items:center; }
  .grid { position:absolute; inset:0; background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size:48px 48px; opacity:.22; mask-image:radial-gradient(circle at 50% 45%, #000 20%, transparent 75%); }
  .card { position:relative; width:min(980px, 86vw); padding:36px 40px 40px; background:var(--panel); border:1px solid var(--line); border-radius:20px; box-shadow:0 30px 80px rgba(0,0,0,.45); }
  h1 { margin:0 0 4px; font-size:30px; letter-spacing:-.01em; }
  .sub { color:var(--mute); font-size:18px; margin-bottom:28px; }
  .tiles { display:grid; grid-template-columns:repeat(6, 1fr); gap:14px; }
  .tile { height:112px; border-radius:12px; border:1px dashed var(--line); background:transparent; padding:14px; display:flex; flex-direction:column; justify-content:space-between; opacity:.5; }
  .tile b { font-size:15px; font-weight:600; } .tile span { font-size:13px; color:var(--mute); }
  .tile.on { background:linear-gradient(160deg, #1b2a4d, #16223c); border:1px solid #2f4a85; opacity:1; }
  .row { display:flex; align-items:center; justify-content:space-between; margin-top:30px; }
  .count { font-size:54px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  .count small { font-size:20px; color:var(--mute); font-weight:500; margin-left:10px; }
  .badge { font-size:20px; font-weight:600; padding:12px 20px; border-radius:999px; border:1px solid; opacity:0; }
  .badge.free { color:var(--warn); border-color:#7a5a12; background:rgba(251,191,36,.08); }
  .badge.prem { color:var(--ok); border-color:#1e6f55; background:rgba(52,211,153,.10); }
  .bar { height:8px; border-radius:6px; background:#0e1626; margin-top:22px; overflow:hidden; } .bar i { display:block; height:100%; width:0; background:var(--accent); border-radius:6px; }
</style></head>
<body><div class="stage"><div class="grid"></div>
  <div class="card">
    <h1>Jobs you can create this month</h1>
    <div class="sub">Free plan</div>
    <div class="tiles" id="tiles"></div>
    <div class="bar"><i id="fill"></i></div>
    <div class="row"><div class="count"><span id="n">0</span><small>of 6 new jobs</small></div>
      <div><span class="badge free" id="b1">Limit reached</span><span class="badge prem" id="b2" style="position:absolute;right:40px;margin-top:-26px">Premium: no monthly limit</span></div></div>
  </div></div>
<script>
  const names = ['Kitchen', 'Master bath', 'Repaint', 'Basement', 'Deck', 'Porch rail'];
  const tiles = document.getElementById('tiles');
  names.forEach((n, i) => { const t = document.createElement('div'); t.className = 'tile'; t.innerHTML = '<b>Job ' + (i + 1) + '</b><span>' + n + '</span>'; tiles.appendChild(t); });
  const els = [...tiles.children], n = document.getElementById('n'), fill = document.getElementById('fill');
  const b1 = document.getElementById('b1'), b2 = document.getElementById('b2');
  window.__done = false;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  (async () => {
    await wait(900);
    for (let i = 0; i < 6; i++) {
      els[i].classList.add('on');
      els[i].animate([{ transform: 'translateY(14px) scale(.96)', opacity: .2 }, { transform: 'none', opacity: 1 }], { duration: 420, easing: 'cubic-bezier(.2,.8,.2,1)' });
      n.textContent = i + 1; fill.style.transition = 'width .42s ease'; fill.style.width = ((i + 1) / 6 * 100) + '%';
      await wait(620);
    }
    b1.style.opacity = 1; b1.animate([{ transform: 'scale(.8)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: 380, easing: 'ease-out' });
    document.getElementById('n').style.color = '#fbbf24';
    await wait(1800);
    b1.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' });
    els.forEach((e) => e.classList.remove('on')); n.textContent = '0'; fill.style.width = '0'; n.style.color = '';
    await wait(500);
    b2.style.opacity = 1; b2.animate([{ transform: 'translateX(30px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 450, easing: 'ease-out' });
    for (let i = 0; i < 6; i++) { els[i].classList.add('on'); await wait(120); }
    await wait(1500);
    window.__done = true;
  })();
</script></body></html>
