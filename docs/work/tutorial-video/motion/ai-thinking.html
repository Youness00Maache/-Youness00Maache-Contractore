<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>motion: the assistant works on your request</title>
<link rel="stylesheet" href="kit.css">
<style>
  .col { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:880px; }
  .bubble { width:max-content; max-width:760px; margin-left:auto; padding:16px 22px; border-radius:20px 20px 4px 20px; background:var(--accent); color:#fff; font-size:25px; font-weight:600; min-height:60px; }
  .dots { display:flex; gap:10px; margin:30px 0 8px 10px; height:22px; } .dots i { width:16px; height:16px; border-radius:50%; background:var(--mute); animation:pulse 1.1s infinite; } .dots i:nth-child(2){ animation-delay:.18s } .dots i:nth-child(3){ animation-delay:.36s } @keyframes pulse { 50% { opacity:.25; transform:scale(.7); } }
  .chips { display:flex; gap:14px; margin:8px 0 0 10px; height:46px; } .chip2 { padding:10px 18px; border-radius:999px; border:1px solid #2f4a85; background:#16223c; color:#9db8ff; font-size:20px; font-weight:600; opacity:0; transform:translateX(-60px); transition:opacity .5s ease, transform .6s cubic-bezier(.2,.8,.2,1); } .chip2.on { opacity:1; transform:none; }
  .draft { position:absolute; left:0; right:0; top:-190px; background:var(--panel); border:1px solid #2f4a85; border-radius:20px; padding:22px 26px; box-shadow:0 30px 80px rgba(0,0,0,.45); opacity:0; transform:translateY(24px); transition:opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1); } .draft.on { opacity:1; transform:none; }
  .draft h2 { margin:0 0 12px; font-size:28px; } .ln { display:flex; justify-content:space-between; padding:9px 0; border-top:1px solid var(--line); font-size:21px; } .ln em { font-style:normal; font-size:13px; font-weight:700; color:#9db8ff; background:rgba(79,124,255,.14); border:1px solid #2f4a85; border-radius:999px; padding:2px 9px; margin-left:10px; vertical-align:2px; } .ln span:last-child { font-variant-numeric:tabular-nums; } .ln .nop { color:var(--warn); }
  .btns { display:flex; gap:12px; margin-top:16px; } .btns span { padding:11px 22px; border-radius:12px; border:1px solid var(--line); font-size:20px; font-weight:700; } .btns span:first-child { background:var(--accent); border-color:var(--accent); color:#fff; }
  .hide { transition:opacity .4s ease; } .hide.gone { opacity:0; }
</style></head>
<body><div class="stage"><div class="grid"></div>
  <div class="col">
    <div class="hide" id="chat"><div class="bubble" id="bub"></div>
      <div class="dots fade" id="dots"><i></i><i></i><i></i></div>
      <div class="chips"><span class="chip2" id="k1">Your request</span><span class="chip2" id="k2">Your price book</span><span class="chip2" id="k3">Greg Halvorsen</span></div></div>
    <div class="draft" id="draft"><h2>Estimate: Deck 12 x 14</h2>
      <div class="ln"><span>Deck framing, pressure-treated<em>price book</em></span><span>$1,848.00</span></div>
      <div class="ln"><span>Composite decking install<em>price book</em></span><span>$2,352.00</span></div>
      <div class="ln"><span>Deck railing, per linear foot<em>price book</em></span><span>$1,596.00</span></div>
      <div class="ln"><span>Stairs, 3 steps</span><span class="nop">price needed</span></div>
      <div class="ln"><span>Permit and inspection</span><span class="nop">price needed</span></div>
      <div class="btns"><span>Open &amp; edit</span><span>Save</span><span>Discard</span></div></div>
  </div>
</div>
<script src="kit.js"></script>
<script>
  const k = kit;
  k.type(k.$('#bub'), 'Draft an estimate for a 12 x 14 deck for Greg Halvorsen', 0.5, 2.4);
  k.on(k.$('#dots'), 3.1); k.on(k.$('#k1'), 3.4); k.on(k.$('#k2'), 4.6); k.on(k.$('#k3'), 5.8);
  k.at(7.0, () => { k.$('#chat').classList.add('gone'); }); k.on(k.$('#draft'), 7.3);
</script></body></html>
