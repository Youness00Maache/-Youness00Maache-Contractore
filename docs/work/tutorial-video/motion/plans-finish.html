<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>motion: what to do first</title>
<link rel="stylesheet" href="kit.css">
<style>
  .wrap { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:820px; }
  .wrap h1 { margin:0 0 22px; font-size:36px; letter-spacing:-.01em; }
  .row { font-size:27px; } .n { flex:none; width:38px; height:38px; border-radius:50%; display:grid; place-items:center; font-size:20px; background:#1b2a4d; border:1px solid #2f4a85; transition:background .4s ease, border-color .4s ease, color .4s ease; } .row.on .n { background:rgba(52,211,153,.18); border-color:#1e6f55; color:var(--ok); }
  .row { opacity:.3; transition:opacity .4s ease, border-color .4s ease; } .row.on { opacity:1; border-color:#2f4a85; }
  .help { margin-top:6px; text-align:center; color:var(--mute); font-size:21px; opacity:0; transition:opacity .5s ease; } .help.on { opacity:1; }
  .end { position:absolute; inset:0; display:grid; place-items:center; background:var(--bg); opacity:0; transition:opacity .7s ease; pointer-events:none; } .end.on { opacity:1; }
  .end .lg { width:92px; height:92px; border-radius:24px; background:linear-gradient(135deg,#3b5bff,#4f7cff); margin:0 auto 22px; box-shadow:0 20px 60px rgba(79,124,255,.4); } .end h1 { margin:0; font-size:52px; letter-spacing:-.02em; text-align:center; } .end p { margin:14px 0 0; text-align:center; color:var(--mute); font-size:23px; }
</style></head>
<body><div class="stage"><div class="grid"></div>
  <div class="wrap"><h1>Here is what to do first</h1><div id="list"></div><div class="help" id="help">Help and tutorials is always one click away. Or ask AI Command.</div></div>
  <div class="end" id="end"><div><div class="lg"></div><h1>Welcome to ContractorDocs</h1><p>Help and tutorials is always one click away</p></div></div>
</div>
<script src="kit.js"></script>
<script>
  const k = kit;
  const items = [[4.4, 'Company details and logo'], [9.4, 'Add a client'], [10.3, 'Create a job'], [11.2, 'Make an estimate'], [13.2, 'Share it with your client'], [15.6, 'Convert to invoice and get paid']];
  const list = k.$('#list');
  items.forEach(([t, txt], i) => { const r = document.createElement('div'); r.className = 'row'; r.style.cssText = 'display:flex;align-items:center;gap:16px;padding:15px 22px;margin:0 0 12px;border-radius:14px;border:1px solid var(--line);background:var(--panel)'; r.innerHTML = '<span class="n">' + (i + 1) + '</span><div>' + txt + '</div>'; list.appendChild(r); k.on(r, t); });
  k.on(k.$('#help'), 18.4); k.on(k.$('#end'), 22.9);
</script></body></html>
